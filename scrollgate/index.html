<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ScrollGate">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>ScrollGate</title>
<style>
:root{
  --bg:#0b0d12; --card:#151922; --card2:#1d2331; --line:#262d3d;
  --text:#eef1f7; --dim:#8b93a7; --accent:#6ee7b7; --accent2:#38bdf8;
  --warn:#fbbf24; --bad:#f87171;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
}
#app{min-height:100%;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 84px);max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0;letter-spacing:-.4px}
h2{font-size:15px;margin:0 0 10px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.muted{color:var(--dim);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{display:block;width:100%;padding:16px;border-radius:16px;background:var(--card2);
  border:1px solid var(--line);font-weight:600;text-align:center;transition:transform .08s}
.btn:active{transform:scale(.98)}
a.btn{color:var(--text);text-decoration:none}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#05221c;border:0}
.btn.ghost{background:none}
.btn[disabled]{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:var(--accent);color:#05221c;border-color:transparent}
input,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;
  padding:12px;color:var(--text);font:inherit;-webkit-user-select:text;user-select:text}
input[type=number]{width:88px;text-align:center}
textarea{min-height:76px;resize:none}
.ring{display:block;margin:4px auto 2px}
.big{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-1px}
.center{text-align:center}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bar i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--accent2);min-height:3px}
.bar i.over{background:var(--bad)}
.bar i.zero{background:var(--card2)}
.bar span{font-size:11px;color:var(--dim)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;
  padding:8px 12px calc(var(--safe-b) + 8px);background:rgba(11,13,18,.82);
  backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tab{flex:1;max-width:150px;padding:8px;border-radius:12px;text-align:center;font-size:12px;color:var(--dim);font-weight:600}
.tab.on{color:var(--accent);background:var(--card)}
.tab b{display:block;font-size:19px;font-weight:400;line-height:1.2}
.hold{position:relative;overflow:hidden}
.sticky{position:sticky;bottom:calc(var(--safe-b) + 12px);margin-top:18px;
  box-shadow:0 10px 30px rgba(11,13,18,.9)}
.hold .fill{position:absolute;inset:0;width:0;background:rgba(110,231,183,.28)}
.sessions li{list-style:none;display:flex;justify-content:space-between;gap:10px;
  padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.sessions{margin:0;padding:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}
.hide{display:none}
.overtime{color:var(--bad)}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------------- state ---------------- */
const KEY = "scrollgate.v1";
const DEFAULTS = {
  settings: {
    dailyBudgetMin: 30,
    maxSessions: 3,
    defaultLenMin: 10,
    cooldownMin: 45,
    holdSeconds: 5,
  },
  sessions: [],   // {id,start,end,plannedMin,actualSec,app,intent,worth}
  active: null,   // {start,plannedMin,app,intent}
};
const APPS = [
  { id:"yt",   name:"YouTube Shorts", url:"https://www.youtube.com/shorts" },
  { id:"ig",   name:"Instagram Reels",url:"https://www.instagram.com/reels/" },
  { id:"tt",   name:"TikTok",         url:"https://www.tiktok.com/" },
  { id:"fb",   name:"Facebook Reels", url:"https://www.facebook.com/reel/" },
  { id:"sn",   name:"Snap Spotlight", url:"https://www.snapchat.com/spotlight" },
  { id:"rd",   name:"Reddit",         url:"https://www.reddit.com/" },
  { id:"x",    name:"X",              url:"https://x.com/" },
  { id:"other",name:"Something else", url:"" },
];
const appById = id => APPS.find(a => a.id === id) || APPS[APPS.length - 1];

let S = load();
function load(){
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (!raw) return structuredClone(DEFAULTS);
    return { ...structuredClone(DEFAULTS), ...raw,
             settings:{ ...DEFAULTS.settings, ...(raw.settings||{}) } };
  } catch { return structuredClone(DEFAULTS); }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

/* ---------------- helpers ---------------- */
const dayKey = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
const today = () => dayKey(Date.now());
const mins = sec => Math.round(sec/60);
const showMin = sec => sec > 0 && sec < 60 ? "<1m" : mins(sec) + "m";
const clamp = (n,a,b) => Math.max(a, Math.min(b,n));
function fmt(sec){
  const s = Math.abs(Math.round(sec));
  return (sec<0?"-":"") + Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
const sessionsOn = day => S.sessions.filter(s => dayKey(s.start) === day);
const secondsOn  = day => sessionsOn(day).reduce((n,s) => n + s.actualSec, 0);

function usedToday(){
  let sec = secondsOn(today());
  if (S.active) sec += (Date.now() - S.active.start)/1000;
  return sec;
}
function budgetSec(){ return S.settings.dailyBudgetMin * 60; }
function sessionsToday(){ return sessionsOn(today()).length + (S.active ? 1 : 0); }
function cooldownLeft(){
  const last = S.sessions.filter(s => s.end).sort((a,b) => b.end - a.end)[0];
  if (!last) return 0;
  return Math.max(0, last.end + S.settings.cooldownMin*60000 - Date.now())/1000;
}
function gateBlock(){
  if (S.settings.maxSessions && sessionsToday() >= S.settings.maxSessions)
    return { why:"You've used all " + S.settings.maxSessions + " sessions for today.", until:"Resets at midnight." };
  if (usedToday() >= budgetSec())
    return { why:"Today's " + S.settings.dailyBudgetMin + " minute budget is spent.", until:"Resets at midnight." };
  const cd = cooldownLeft();
  if (cd > 0)
    return { why:"Cooling down between sessions.", until:"Opens again in " + fmt(cd) + ".", live:true };
  return null;
}

/* streak: consecutive days (ending yesterday or today) at or under budget */
function streak(){
  if (!S.sessions.length) return 0;
  const first = dayKey(Math.min(...S.sessions.map(s => s.start)));
  let n = 0, d = today();
  if (secondsOn(d) === 0 && !S.active) d -= 86400000;   // today hasn't started yet
  while (d >= first && secondsOn(d) <= budgetSec()) { n++; d -= 86400000; }
  return n;
}

/* ---------------- rendering ---------------- */
let view = "home";        // home | gate | active | debrief | stats | settings
let draft = { app:"yt", len:null, intent:"" };
let pending = null;       // finished session awaiting debrief
const el = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  if (S.active) view = "active";
  else if (pending) view = "debrief";
  else if (view === "active" || view === "debrief") view = "home";

  el.innerHTML = ({ home:homeView, gate:gateView, active:activeView,
                    debrief:debriefView, stats:statsView, settings:settingsView })[view]()
                 + (view === "active" || view === "gate" || view === "debrief" ? "" : tabsView());
  wire();
}

function ringSVG(frac, label, sub){
  const r = 62, c = 2*Math.PI*r, over = frac > 1;
  const col = over ? "var(--bad)" : frac > .75 ? "var(--warn)" : "var(--accent)";
  return `<svg class="ring" width="164" height="164" viewBox="0 0 164 164">
    <circle cx="82" cy="82" r="${r}" fill="none" stroke="var(--card2)" stroke-width="12"/>
    <circle cx="82" cy="82" r="${r}" fill="none" stroke="${col}" stroke-width="12"
      stroke-linecap="round" stroke-dasharray="${c}"
      stroke-dashoffset="${c*(1-clamp(frac,0,1))}" transform="rotate(-90 82 82)"/>
    <text x="82" y="78" text-anchor="middle" fill="var(--text)" font-size="30" font-weight="700">${label}</text>
    <text x="82" y="100" text-anchor="middle" fill="var(--dim)" font-size="12">${sub}</text>
  </svg>`;
}

function homeView(){
  const used = usedToday(), b = budgetSec(), left = Math.max(0, b - used);
  const block = gateBlock();
  const list = sessionsOn(today()).sort((a,b) => b.start - a.start);
  return `
  <div class="row" style="margin-bottom:16px">
    <h1>ScrollGate</h1>
    <span class="muted">${new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}</span>
  </div>
  <div class="card center">
    ${ringSVG(used/b, mins(left) + "m", "left of " + S.settings.dailyBudgetMin + "m")}
    <div class="muted">${sessionsToday()} of ${S.settings.maxSessions} sessions used${
      streak() > 1 ? " &middot; " + streak() + "-day streak" : ""}</div>
  </div>
  ${block ? `<div class="card">
      <div style="font-weight:600;margin-bottom:4px">Gate closed</div>
      <div class="muted">${esc(block.why)}</div>
      <div class="muted" id="until" style="margin-top:6px">${esc(block.until)}</div>
    </div>
    <button class="btn ghost" data-go="stats">See where the time went</button>`
   : `<button class="btn primary" data-go="gate">Open the gate</button>
      <p class="muted center" style="margin:12px 4px 18px">
        You'll pick one app, one reason, and one time limit before anything opens.</p>`}
  ${list.length ? `<div class="card">
      <h2>Today</h2>
      <ul class="sessions">${list.map(s => `<li>
        <span><span class="dot" style="background:${
          s.worth === "worth" ? "var(--accent)" : s.worth === "regret" ? "var(--bad)" : "var(--dim)"
        }"></span>${esc(appById(s.app).name)}<br>
        <span class="muted">${esc(s.intent || "no reason given")}</span></span>
        <span class="big">${showMin(s.actualSec)}</span></li>`).join("")}</ul>
    </div>` : ""}`;
}

function gateView(){
  const b = budgetSec(), leftMin = Math.max(1, mins(b - usedToday()));
  const opts = [5,10,15,20,30].filter(n => n <= leftMin);
  if (!opts.length) opts.push(leftMin);
  if (draft.len === null || !opts.includes(draft.len))
    draft.len = opts.includes(S.settings.defaultLenMin) ? S.settings.defaultLenMin : opts[0];
  const ready = draft.intent.trim().length >= 8;
  return `
  <div class="row" style="margin-bottom:16px">
    <h1>Before you scroll</h1>
    <button class="btn ghost" style="width:auto;padding:8px 12px" data-go="home">Cancel</button>
  </div>
  <div class="card">
    <h2>1 &middot; Where</h2>
    <div class="chips">${APPS.map(a =>
      `<button class="chip${draft.app === a.id ? " on":""}" data-app="${a.id}">${esc(a.name)}</button>`).join("")}</div>
  </div>
  <div class="card">
    <h2>2 &middot; How long</h2>
    <div class="chips">${opts.map(n =>
      `<button class="chip${draft.len === n ? " on":""}" data-len="${n}">${n} min</button>`).join("")}</div>
    <p class="muted" style="margin:10px 0 0">${leftMin} min left in today's budget.</p>
  </div>
  <div class="card">
    <h2>3 &middot; Why</h2>
    <textarea id="intent" placeholder="What are you actually going there for?"
      maxlength="140">${esc(draft.intent)}</textarea>
    <p class="muted" style="margin:8px 0 0">${ready ? "Good. Hold the button below." : "At least 8 characters — make it honest."}</p>
  </div>
  <button class="btn primary hold sticky" id="hold" ${ready ? "" : "disabled"}>
    <span class="fill"></span><span style="position:relative">Hold ${S.settings.holdSeconds}s to open</span>
  </button>`;
}

function activeView(){
  const a = S.active, planned = a.plannedMin*60;
  const leftSec = planned - (Date.now() - a.start)/1000;
  const over = leftSec < 0;
  return `
  <div class="center" style="padding-top:8vh">
    <p class="muted">${esc(appById(a.app).name)}</p>
    <div class="big ${over ? "overtime":""}" id="clock" style="font-size:74px;margin:6px 0">${fmt(leftSec)}</div>
    <p class="muted" id="clocksub">${over ? "over your limit" : "of " + a.plannedMin + " minutes"}</p>
    <div class="card" style="margin:26px 0 20px;text-align:left">
      <h2>You said</h2><div>${esc(a.intent)}</div>
    </div>
    ${appById(a.app).url
      ? `<a class="btn" href="${appById(a.app).url}" target="_blank" rel="noopener">Open ${esc(appById(a.app).name)}</a>`
      : ""}
    <button class="btn primary" style="margin-top:10px" id="stop">I'm done</button>
    <p class="muted" style="margin-top:18px">Leave this tab open — it keeps counting either way.</p>
  </div>`;
}

function debriefView(){
  return `
  <h1 style="margin-bottom:6px">That was ${mins(pending.actualSec)} min</h1>
  <p class="muted" style="margin-top:0">on ${esc(appById(pending.app).name)}${
    pending.actualSec > pending.plannedMin*60 + 30
      ? " — " + mins(pending.actualSec - pending.plannedMin*60) + " min past your limit" : ""}.</p>
  <div class="card">
    <h2>Was it worth it?</h2>
    <div class="chips">
      <button class="chip" data-worth="worth">Worth it</button>
      <button class="chip" data-worth="meh">Meh</button>
      <button class="chip" data-worth="regret">Regret it</button>
    </div>
  </div>
  <p class="muted center">Answering builds the record you'll read in Stats.</p>`;
}

function statsView(){
  const days = [...Array(7)].map((_,i) => today() - (6-i)*86400000);
  const secs = days.map(secondsOn);
  const peak = Math.max(budgetSec(), ...secs, 1);
  const week = S.sessions.filter(s => s.start >= days[0]);
  const rated = week.filter(s => s.worth);
  const regret = rated.filter(s => s.worth === "regret").length;
  return `
  <h1 style="margin-bottom:16px">Stats</h1>
  <div class="card">
    <h2>Last 7 days</h2>
    <div class="bars">${days.map((d,i) => `<div class="bar">
      <span>${mins(secs[i]) || ""}</span>
      <i class="${!secs[i] ? "zero" : secs[i] > budgetSec() ? "over":""}" style="height:${(secs[i]/peak)*100}%"></i>
      <span>${new Date(d).toLocaleDateString(undefined,{weekday:"narrow"})}</span></div>`).join("")}</div>
    <p class="muted" style="margin:12px 0 0">Red bars are days over your ${S.settings.dailyBudgetMin} min budget.</p>
  </div>
  <div class="card">
    <h2>This week</h2>
    <div class="row"><span>Total time</span><b>${mins(secs.reduce((a,b)=>a+b,0))} min</b></div>
    <div class="row" style="margin-top:8px"><span>Sessions</span><b>${week.length}</b></div>
    <div class="row" style="margin-top:8px"><span>Days under budget</span><b>${
      secs.filter(s => s <= budgetSec()).length} of 7</b></div>
    <div class="row" style="margin-top:8px"><span>Regretted</span><b>${
      rated.length ? Math.round(regret/rated.length*100) + "% of rated" : "not rated yet"}</b></div>
  </div>
  ${week.length ? `<div class="card">
    <h2>Reasons you gave</h2>
    <ul class="sessions">${week.slice(-12).reverse().map(s => `<li>
      <span>${esc(s.intent || "no reason given")}<br>
      <span class="muted">${new Date(s.start).toLocaleDateString(undefined,{weekday:"short"})} &middot; ${
        esc(appById(s.app).name)}</span></span>
      <span class="big">${showMin(s.actualSec)}</span></li>`).join("")}</ul>
  </div>` : `<p class="muted center">No sessions logged yet.</p>`}`;
}

function settingsView(){
  const s = S.settings;
  return `
  <h1 style="margin-bottom:16px">Settings</h1>
  <div class="card">
    <div class="row"><span>Daily budget<br><span class="muted">minutes</span></span>
      <input type="number" min="5" max="240" step="5" data-set="dailyBudgetMin" value="${s.dailyBudgetMin}"></div>
    <div class="row" style="margin-top:14px"><span>Sessions per day<br><span class="muted">hard cap</span></span>
      <input type="number" min="1" max="12" data-set="maxSessions" value="${s.maxSessions}"></div>
    <div class="row" style="margin-top:14px"><span>Cooldown<br><span class="muted">minutes between sessions</span></span>
      <input type="number" min="0" max="480" step="5" data-set="cooldownMin" value="${s.cooldownMin}"></div>
    <div class="row" style="margin-top:14px"><span>Hold to unlock<br><span class="muted">seconds of friction</span></span>
      <input type="number" min="0" max="30" data-set="holdSeconds" value="${s.holdSeconds}"></div>
  </div>
  <div class="card">
    <h2>On your iPhone</h2>
    <p class="muted" style="margin:0">Share &rarr; Add to Home Screen to run this full-screen and offline.
    For real enforcement, pair it with Screen Time: set app limits on the video apps and keep this as the
    only way you unlock them.</p>
  </div>
  <button class="btn ghost" id="export">Export my data</button>
  <button class="btn ghost" id="reset" style="color:var(--bad)">Erase everything</button>`;
}

function tabsView(){
  const t = (id,icon,label) =>
    `<button class="tab${view === id ? " on":""}" data-go="${id}"><b>${icon}</b>${label}</button>`;
  return `<nav class="tabs">${t("home","◎","Today")}${t("stats","≡","Stats")}${t("settings","⚙","Settings")}</nav>`;
}

/* ---------------- interaction ---------------- */
function wire(){
  el.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { view = b.dataset.go; render(); });
  el.querySelectorAll("[data-app]").forEach(b => b.onclick = () => { draft.app = b.dataset.app; render(); });
  el.querySelectorAll("[data-len]").forEach(b => b.onclick = () => { draft.len = +b.dataset.len; render(); });

  const intent = el.querySelector("#intent");
  if (intent) intent.oninput = () => {
    const wasReady = !el.querySelector("#hold").disabled;
    draft.intent = intent.value;
    if ((draft.intent.trim().length >= 8) !== wasReady) {
      const pos = intent.selectionStart; render();
      const n = el.querySelector("#intent"); n.focus(); n.setSelectionRange(pos,pos);
    }
  };

  const hold = el.querySelector("#hold");
  if (hold) setupHold(hold);

  const stop = el.querySelector("#stop");
  if (stop) stop.onclick = endSession;

  el.querySelectorAll("[data-worth]").forEach(b => b.onclick = () => {
    pending.worth = b.dataset.worth;
    S.sessions.push(pending); pending = null; save(); view = "home"; render();
  });

  el.querySelectorAll("[data-set]").forEach(i => i.onchange = () => {
    S.settings[i.dataset.set] = clamp(+i.value || 0, +i.min, +i.max); save(); render();
  });

  const exp = el.querySelector("#export");
  if (exp) exp.onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
    a.download = "scrollgate-" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
  };
  const rst = el.querySelector("#reset");
  if (rst) rst.onclick = () => {
    if (confirm("Erase all sessions and settings?")) {
      localStorage.removeItem(KEY); S = load(); view = "home"; render();
    }
  };
}

function setupHold(btn){
  const fill = btn.querySelector(".fill");
  const need = S.settings.holdSeconds * 1000;
  let t0 = 0, raf = 0;
  const step = () => {
    const p = need ? (performance.now() - t0)/need : 1;
    fill.style.width = clamp(p,0,1)*100 + "%";
    if (p >= 1) { cancel(); startSession(); }
    else raf = requestAnimationFrame(step);
  };
  const cancel = () => { cancelAnimationFrame(raf); raf = 0; fill.style.width = "0"; };
  const begin = e => { e.preventDefault(); if (btn.disabled || raf) return; t0 = performance.now(); step(); };
  btn.addEventListener("touchstart", begin, {passive:false});
  btn.addEventListener("mousedown", begin);
  ["touchend","touchcancel","mouseup","mouseleave"].forEach(ev => btn.addEventListener(ev, cancel));
}

async function startSession(){
  if (gateBlock()) { view = "home"; render(); return; }
  S.active = { start: Date.now(), plannedMin: draft.len, app: draft.app, intent: draft.intent.trim() };
  save();
  draft = { app: draft.app, len: null, intent: "" };
  render();
  keepAwake();
  const url = appById(S.active.app).url;
  if (url) window.open(url, "_blank", "noopener");
}

function endSession(){
  const a = S.active;
  pending = { id: a.start, start: a.start, end: Date.now(), plannedMin: a.plannedMin,
              actualSec: Math.round((Date.now() - a.start)/1000), app: a.app, intent: a.intent, worth: null };
  S.active = null; save(); releaseAwake(); render();
}

/* ---------------- ticking ---------------- */
let warned = false;
setInterval(() => {
  if (S.active) {
    const leftSec = S.active.plannedMin*60 - (Date.now() - S.active.start)/1000;
    const clock = el.querySelector("#clock"), sub = el.querySelector("#clocksub");
    if (clock) {
      clock.textContent = fmt(leftSec);
      clock.classList.toggle("overtime", leftSec < 0);
      if (sub) sub.textContent = leftSec < 0 ? "over your limit" : "of " + S.active.plannedMin + " minutes";
    }
    if (leftSec <= 0 && !warned) { warned = true; buzz(); notify(); }
    if (leftSec > 0) warned = false;
  } else if (view === "home") {
    const u = el.querySelector("#until");
    const b = gateBlock();
    if (u && b && b.live) u.textContent = b.until;
    else if ((u && !b) || (!u && b)) render();
  }
}, 1000);

function buzz(){ if (navigator.vibrate) navigator.vibrate([220,120,220,120,400]); }
function notify(){
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  new Notification("Time's up", { body: "Your " + S.active.plannedMin + " minutes are done. Close it." });
}

let lock = null;
async function keepAwake(){
  try { if ("wakeLock" in navigator) lock = await navigator.wakeLock.request("screen"); } catch {}
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
}
function releaseAwake(){ try { lock && lock.release(); } catch {} lock = null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { if (S.active) keepAwake(); render(); }
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body>
</html>
